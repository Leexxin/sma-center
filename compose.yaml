name: sma-center
services:
  sma-center:
    build: .
    image: sma-center:latest
    container_name: sma-center
    restart: unless-stopped
    init: true
    ports:
      - "192.168.33.124:8080:3000"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  data:
    name: sma-center-data
    external: true
